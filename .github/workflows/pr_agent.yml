name: PR Agent (Claude)
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provide OPENAI_KEY to satisfy PR-Agent's startup check
          OPENAI_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          ANTHROPIC__KEY: ${{ secrets.ANTHROPIC_KEY }}
          
          # Configuration settings
          CONFIG__MODEL: "anthropic/claude-sonnet-4-5-20250929"
          CONFIG__FALLBACK_MODELS: '["anthropic/claude-sonnet-4-20250514"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: 200000
          
          # Action triggers
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
